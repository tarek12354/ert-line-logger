name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Rebuild Android Folder
        run: |
          # حذف المجلد القديم لضمان عدم وجود ملفات معطوبة
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fix Gradle Permissions & Build
        run: |
          cd android
          # إجبار النظام على استخدام نسخة Gradle مستقرة لتجنب خطأ 403
          ./gradlew wrapper --gradle-version 8.10
          chmod +x gradlew
          # تشغيل البناء مع تجاهل الفحوصات الخارجية تماماً
          ./gradlew assembleDebug -x lint -x check -x test --no-daemon

      - name: Secure APK Upload
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Final-Fix
          path: android/app/build/outputs/apk/debug/app-debug.apk
