name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize & Sync Android
        run: |
          # إضافة منصة أندرويد إذا لم تكن موجودة
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # تحديث الملفات البرمجية داخل مجلد أندرويد
          npx cap copy android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          # التأكد من وجود ملف gradlew وإعطاؤه صلاحية التنفيذ
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, trying to fix..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Final-Fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
