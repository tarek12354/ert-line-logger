name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --force
          # التأكد من وجود المكتبات الأساسية التي يطلبها الكود
          npm install @ionic/react @ionic/react-router ionicons --force

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize Android
        run: |
          # إضافة المنصة فقط إذا لم تكن موجودة لمنع الخطأ
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
