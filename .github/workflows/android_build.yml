name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # التبديل للأحدث تلقائياً

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js (20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20 # إصدار LTS أكثر استقراراً لعمليات البناء
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps 
          # استخدام install بدلاً من ci لتجاوز تعارضات Capacitor الحديثة

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK (17)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Java 17 هي الأكثر توافقاً مع Gradle 8+
          distribution: 'temurin'

      - name: Initialize & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          ./gradlew clean # تنظيف المخلفات السابقة قبل البناء
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
