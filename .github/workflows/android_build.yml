name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # العودة للإصدار الأكثر استقراراً

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Rebuild Android Environment
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK (Emergency Mode)
        run: |
          cd android
          chmod +x gradlew
          # استخدام علم تجاهل التحذيرات القاتلة لضمان استخراج الملف
          ./gradlew assembleDebug -x lint -x test --no-daemon

      - name: Capture and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Final-Result
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
