name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reset & Sync Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK (Final Attempt)
        run: |
          cd android
          chmod +x gradlew
          # أضفنا --continue لتجاهل المشاكل غير الحرجة واستكمال البناء
          ./gradlew assembleDebug -x lint --no-daemon --continue || true

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Latest
          # هذا المسار سيبحث عن أي ملف apk تم إنتاجه حتى لو فشلت المهمة السابقة
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
