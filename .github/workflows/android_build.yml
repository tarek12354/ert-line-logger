name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reset & Sync Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint --no-daemon

      - name: Locate and Move APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/app-debug.apk \;
          echo "APK moved to output folder"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ERT-App-Success
          path: output/app-debug.apk
          if-no-files-found: error
